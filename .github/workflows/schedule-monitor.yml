name: Check Turiba schedule

on:
  schedule:
    # Roughly 05:50 and 21:50 Europe/Riga. GitHub often delays scheduled runs
    # by hours, so every run performs the check (it only notifies on change).
    - cron: "50 2 * * *"
    - cron: "50 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-monitor
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The snapshot lives in the Actions cache rather than being committed,
      # so the timetable isn't published in this public repository.
      - name: Restore previous schedule snapshot
        uses: actions/cache/restore@v6
        with:
          path: monitor/schedule.tsv
          key: schedule-snapshot-${{ github.run_id }}
          restore-keys: schedule-snapshot-

      - name: Scrape and notify
        env:
          TURIBA_GROUP_CODE: ${{ secrets.TURIBA_GROUP_CODE }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          SCHEDULE_STATE_FILE: monitor/schedule.tsv
        run: mvn -q -DskipTests compile exec:java -Dexec.mainClass=com.calendar.monitor.ScheduleMonitor

      - name: Save schedule snapshot
        uses: actions/cache/save@v6
        with:
          path: monitor/schedule.tsv
          key: schedule-snapshot-${{ github.run_id }}
