name: Check Turiba schedule

on:
  schedule:
    # Roughly 05:50 and 21:50 Europe/Riga. GitHub often delays scheduled runs
    # by hours, so every run performs the check (it only notifies on change).
    - cron: "50 2 * * *"
    - cron: "50 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-monitor
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Scrape and notify
        env:
          TURIBA_GROUP_CODE: ${{ secrets.TURIBA_GROUP_CODE }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          SCHEDULE_STATE_FILE: monitor/schedule.sha256
        run: mvn -q -DskipTests compile exec:java -Dexec.mainClass=com.calendar.monitor.ScheduleMonitor

      - name: Save schedule snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/schedule.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update schedule snapshot"
          git pull --rebase origin main
          git push